name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: featureledger }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: unit + engine tests
        run: cd backend && python -m pytest
      - name: migrate, seed and compute against real Postgres
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/featureledger
        run: cd backend && python -m app.migrate
      - name: RLS blocks reads without a tenant
        run: |
          test "$(PGPASSWORD=app_dev_password psql -h localhost -U featureledger_app -d featureledger -tAc 'select count(*) from features')" = "0"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install --no-audit --no-fund && npm run typecheck && npm run build

  e2e:
    # the full stack exactly as a user runs it: docker compose up, then real HTTP checks
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: wait for the dashboard
        run: |
          for i in $(seq 1 90); do curl -fs http://localhost:3000 >/dev/null && exit 0; sleep 5; done
          docker compose ps; docker compose logs api web; exit 1
      - name: API answers with the seeded ledger
        run: |
          curl -fs "http://localhost:8000/api/v1/pnl?window=3" | python3 -c "import json,sys; d=json.load(sys.stdin); z=[f['key'] for f in d['features'] if f['classification']=='zombie']; print('zombies:', z); assert 'legacy-pdf-export' in z"
      - name: dashboard pages render through the proxy
        run: |
          for p in / /features/legacy-pdf-export /simulator /sunset /mappings; do
            curl -fs "http://localhost:3000$p" -o /dev/null && echo "ok $p"
          done
          curl -fs http://localhost:3000/api/v1/periods
      - if: failure()
        run: docker compose logs
