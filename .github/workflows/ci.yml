name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: featureledger }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: unit + engine tests
        run: cd backend && python -m pytest
      - name: migrate, seed and compute against real Postgres
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/featureledger
        run: cd backend && python -m app.migrate
      - name: RLS blocks reads without a tenant
        run: |
          test "$(PGPASSWORD=app_dev_password psql -h localhost -U featureledger_app -d featureledger -tAc 'select count(*) from features')" = "0"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install --no-audit --no-fund && npm run typecheck && npm run build

  e2e:
    # the full stack exactly as a user runs it: docker compose up, then real HTTP checks
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: wait for the dashboard
        run: |
          for i in $(seq 1 90); do curl -fs http://localhost:3000 >/dev/null && exit 0; sleep 5; done
          docker compose ps; docker compose logs api web; exit 1
      - name: worker syncs the five sandbox connectors and the ledger fills in
        run: |
          for i in $(seq 1 60); do
            z=$(curl -fs "http://localhost:8000/api/v1/pnl?window=3" | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(f['key'] for f in d['features'] if f['classification']=='zombie'))" || true)
            echo "attempt $i zombies=[$z]"
            case "$z" in *legacy-pdf-export*) break;; esac
            sleep 5
          done
          case "$z" in *legacy-pdf-export*) ;; *) docker compose logs worker; exit 1;; esac
          curl -fs http://localhost:8000/api/v1/integrations | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          rows = [i for i in d['integrations'] if i['kind'] != 'github']
          for i in rows:
              print(i['kind'], i['health'], i['inbox'])
          assert len(rows) == 5, rows
          assert all(i['health'] == 'healthy' for i in rows), 'not all connectors healthy'
          assert all(i['inbox']['dead_letters'] == 0 for i in rows)
          assert all(i['inbox']['pending'] == 0 for i in rows), 'envelopes left unprocessed'
          "
      - name: manual trigger and sandbox webhook
        run: |
          IDS=$(curl -fs http://localhost:8000/api/v1/integrations)
          STRIPE=$(echo "$IDS" | python3 -c "import json,sys; print([i['id'] for i in json.load(sys.stdin)['integrations'] if i['kind']=='stripe'][0])")
          curl -fs -X POST "http://localhost:8000/api/v1/integrations/$STRIPE/sync"
          curl -fs -X POST "http://localhost:8000/api/v1/webhooks/stripe/$STRIPE" -H "X-FeatureLedger-Secret: sandbox" \
            -H "Content-Type: application/json" \
            -d '{"type":"customer.updated","data":{"object":{"object":"customer","id":"cus_ci_test","email":"x@ci-example.com","metadata":{"company_name":"CI Example","tier":"pro"}}}}'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/api/v1/webhooks/stripe/$STRIPE" -d '{}')
          test "$code" = "401"
      - name: webhook envelope is processed, nothing pending or dead-lettered
        run: |
          for i in $(seq 1 30); do
            out=$(curl -fs http://localhost:8000/api/v1/integrations | python3 -c "
          import json, sys
          rows = [i for i in json.load(sys.stdin)['integrations'] if i['kind'] != 'github']
          print(sum(i['inbox']['pending'] for i in rows), sum(i['inbox']['dead_letters'] for i in rows))")
            echo "pending dead = $out"
            [ "$out" = "0 0" ] && exit 0
            sleep 4
          done
          docker compose logs worker | tail -50; exit 1
      - name: dashboard pages render through the proxy
        run: |
          for p in / /features/legacy-pdf-export /simulator /sunset /mappings /integrations; do
            curl -fs "http://localhost:3000$p" -o /dev/null && echo "ok $p"
          done
          curl -fs http://localhost:3000/api/v1/periods
      - if: failure()
        run: docker compose logs
