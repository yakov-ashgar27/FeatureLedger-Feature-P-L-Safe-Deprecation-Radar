# FeatureLedger Phase 1: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: featureledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d featureledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: { path: .env, required: false }
    environment:
      # migrations + seed as the owner; requests as the RLS-bound app role
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/featureledger
      DATABASE_URL: postgresql://featureledger_app:${APP_DB_PASSWORD:-app_dev_password}@db:5432/featureledger
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev_password}
      SEED_ON_START: ${SEED_ON_START:-true}
      SANDBOX_MODE: ${SANDBOX_MODE:-true}
      REDIS_URL: redis://redis:6379/0
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-northwind}
      ORG_NAME: ${ORG_NAME:-My Company}
      FL_API_TOKEN: ${FL_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      # edit features.yaml on your machine, then POST /api/v1/manifest/apply (or restart the api)
      - ./features.yaml:/srv/features.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # background syncs: every 15 minutes + manual/webhook triggers; rate limits shared through Redis
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: { path: .env, required: false }
    environment:
      DATABASE_URL: postgresql://featureledger_app:${APP_DB_PASSWORD:-app_dev_password}@db:5432/featureledger
      SANDBOX_MODE: ${SANDBOX_MODE:-true}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./features.yaml:/srv/features.yaml:ro
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: { api: { condition: service_healthy } }
    environment:
      API_URL: http://api:8000
      FL_API_TOKEN: ${FL_API_TOKEN:-}
    ports: ["3000:3000"]

volumes:
  pgdata:
